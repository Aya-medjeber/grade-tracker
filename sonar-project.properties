# ---- Project identity (copy these EXACTLY from SonarQube Cloud > Project > Information) ----
sonar.projectKey=Aya-medjeber_grade-tracker
sonar.organization=aya-medjeber
sonar.projectName=Grade Tracker
sonar.projectVersion=1.0.0

# ---- Analysis scope ----
# Application code only lives in src/; tests live in tests/
sonar.sources=src
sonar.tests=tests
# Never analyse generated / cache files
sonar.exclusions=**/__pycache__/**,**/*.pyc
sonar.python.version=3.12

# ---- Reports produced by the "Run tests with coverage" step in sonarcloud.yml ----
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=test-results.xml

sonar.sourceEncoding=UTF-8
