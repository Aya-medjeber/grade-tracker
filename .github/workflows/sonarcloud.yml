name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # Full history so SonarQube Cloud can use git blame for new-code detection
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies (hash-locked, wheels only)
        run: |
          pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      - name: Run tests with coverage
        run: >
          pytest
          --cov=src
          --cov-report=xml:coverage.xml
          --cov-report=term
          --junitxml=test-results.xml

      - name: SonarQube Cloud scan
        # Pinned to the full commit SHA of tag v6.0.0 (githubactions:S7637)
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}